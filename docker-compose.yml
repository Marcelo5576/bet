services:
  betsignal:
    build: .
    container_name: betsignal-cloud
    profiles:
      - bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
  dashboard:
    build: .
    container_name: betsignal-dashboard
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "src.dashboard:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
  caddy:
    image: caddy:2.8
    container_name: betsignal-caddy
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
